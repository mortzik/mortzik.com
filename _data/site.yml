tagline: Sound, perception & polyrhythm.
roles: Electronic music · Soundtrack · Audio-visual
intro: Iranian electronic music producer and soundtrack composer working between sound, perception and the moving image.
bio: |-
  Mortzik is an Iranian electronic music producer and soundtrack composer with a background in electronics engineering. Drawing on synesthesia, he builds intricate polyrhythms and immersive soundscapes that sit between sound and perception.

  Alongside his releases, he works closely with visual artists on audio-visual installations. His work with Amir Mahrav has been shown at Tehran Contemporary Sounds in Berlin and at Bright Festival in Kunstkraftwerk Leipzig, and he composed the music for the Constructed digital art gallery. Recent projects include *Fractal*, with Amirali Khatibi and Helia Jalnick, and *V.04*, with Helia Jalnick.
